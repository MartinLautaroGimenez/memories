<title>Memories</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo de Memories: tus fotos de viajes y eventos sobre una mesa de luz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Reenie+Beanie&display=swap">
<style>
/* Layout: una mesa de luz asimétrica con pilas de copias; cada pila se abre en copias sueltas (Mesa) o en un carrusel 3D de diapositivas. */
:root{
  /* Mesa de luz */
  --table:#E9EEF0; --table-hot:#F9FCFD; --table-edge:#C9D3D8; --grid:rgb(27 35 39 / .06);
  --ink:#172024; --ink-soft:#536168; --line:rgb(23 32 36 / .14); --chip:rgb(23 32 36 / .065);
  --paper:#FCFCFA; --paper-back:#F2F1EC; --paper-ink:#262E33; --mount:#EEECE6; --pen:#22357F;
  --paper-stamp:#C2470C; --paper-btn:#172024; --paper-btn-ink:#F4F8F9;
  --stamp:#FF6B12; --stamp-ink:#B23C05; --shadow:rgb(18 34 44 / .26); --rim:rgb(255 255 255 / 0);
  --scrim:rgb(228 235 238 / .9); --btn:#172024; --btn-ink:#F4F8F9;
  --plate-a:#FDFEFE; --plate-b:#D9E1E4; --led:#AEB8BC; --fx:#0B1013; --grain:.05;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-hand:"Reenie Beanie","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-flip:cubic-bezier(.3,.8,.2,1);
  --side-l:max(16px, env(safe-area-inset-left, 0px)); --side-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  /* Cuarto oscuro */
  --table:#170D0B; --table-hot:#4A130D; --table-edge:#0B0605; --grid:rgb(255 110 90 / .03);
  --ink:#F3E7E1; --ink-soft:#BAA199; --line:rgb(243 231 225 / .15); --chip:rgb(243 231 225 / .08);
  --paper:#EFE9E3; --paper-back:#E7E1DA; --paper-ink:#2A2320; --mount:#E2DDD6; --pen:#22357F;
  --stamp:#FF7A22; --stamp-ink:#FF9A55; --shadow:rgb(0 0 0 / .66); --rim:rgb(255 76 56 / .34);
  --scrim:rgb(16 8 7 / .9); --btn:#F3E7E1; --btn-ink:#1A0F0D;
  --plate-a:#2E1C19; --plate-b:#1B0F0D; --led:#FF7A22; --fx:#000; --grain:.08;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --table:#170D0B; --table-hot:#4A130D; --table-edge:#0B0605; --grid:rgb(255 110 90 / .03);
  --ink:#F3E7E1; --ink-soft:#BAA199; --line:rgb(243 231 225 / .15); --chip:rgb(243 231 225 / .08);
  --paper:#EFE9E3; --paper-back:#E7E1DA; --paper-ink:#2A2320; --mount:#E2DDD6; --pen:#22357F;
  --stamp:#FF7A22; --stamp-ink:#FF9A55; --shadow:rgb(0 0 0 / .66); --rim:rgb(255 76 56 / .34);
  --scrim:rgb(16 8 7 / .9); --btn:#F3E7E1; --btn-ink:#1A0F0D;
  --plate-a:#2E1C19; --plate-b:#1B0F0D; --led:#FF7A22; --fx:#000; --grain:.08;
  color-scheme:dark;
}

html{-webkit-text-size-adjust:100%}
body{
  background:var(--table); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5;
  min-height:100dvh; overflow-x:clip; padding-left:var(--side-l); padding-right:var(--side-r);
  transition:background-color .6s ease; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* La mesa */
.surface{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(80% 62% at 50% -6%, var(--table-hot), transparent 74%),
    radial-gradient(150% 110% at 50% 40%, transparent 52%, var(--table-edge)),
    var(--table);
  transition:background-color .6s ease}
.surface::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(110% 85% at 50% 15%,#000 35%,transparent 85%);mask-image:radial-gradient(110% 85% at 50% 15%,#000 35%,transparent 85%)}
.surface::after{content:"";position:absolute;inset:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.fx{position:fixed;inset:0;z-index:90;pointer-events:none;background:var(--fx);opacity:0}

/* Barra */
.bar{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.wordmark{display:inline-flex;align-items:center;gap:.55rem;color:var(--ink);text-decoration:none;font-stretch:125%;font-weight:800;font-size:1.3rem;letter-spacing:-.035em;margin-right:auto}
.wordmark svg{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.62rem 1.05rem;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:.94rem;font-stretch:96%;cursor:pointer;white-space:nowrap;transition:transform .18s var(--ease-out),background-color .3s,color .3s}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--chip);color:var(--ink);cursor:pointer;transition:transform .18s var(--ease-out)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

/* Interruptor de luz */
.lightswitch{display:inline-flex;align-items:center;gap:.55rem;border:0;background:none;padding:6px 8px;cursor:pointer;font-stretch:84%;font-weight:600;font-size:.94rem;color:var(--ink)}
.ls-plate{position:relative;width:26px;height:40px;border-radius:6px;background:linear-gradient(var(--plate-a),var(--plate-b));box-shadow:inset 0 0 0 1px var(--line),0 2px 5px -1px var(--shadow)}
.ls-rocker{position:absolute;left:6px;right:6px;top:7px;bottom:12px;border-radius:3px;background:linear-gradient(var(--plate-b),var(--plate-a) 48%,var(--plate-b) 52%,var(--plate-a));box-shadow:inset 0 0 0 1px var(--line);transform:perspective(50px) rotateX(-16deg);transition:transform .25s var(--ease-out)}
.lightswitch[aria-checked="true"] .ls-rocker{transform:perspective(50px) rotateX(16deg)}
.ls-led{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
.lightswitch[aria-checked="true"] .ls-led{box-shadow:none}

/* Copias */
.print{position:relative;isolation:isolate}
.paper{position:relative;background:var(--paper);padding:3.4%;border-radius:2px;
  box-shadow:0 0 0 .5px rgb(0 0 0 / .07),inset 0 1px 0 var(--rim),0 1px 1.5px rgb(0 0 0 / .16),0 9px 20px -8px var(--shadow);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.print::after{content:"";position:absolute;inset:6% 7% -1%;z-index:-1;border-radius:10px;box-shadow:0 38px 64px -12px var(--shadow);opacity:var(--lift,0);transition:opacity .35s var(--ease-out)}
.photo{position:relative;aspect-ratio:var(--ar);overflow:hidden;background:color-mix(in srgb,var(--c,#888) 50%,var(--paper))}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .14);pointer-events:none}
.gloss{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,20%),rgb(255 255 255 / .7),rgb(255 255 255 / 0) 48%),linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .14) 48%,transparent 64%)}
.is-tilting .gloss{opacity:1}
.photo .stamp{position:absolute;right:5%;bottom:5.5%;height:6.5%;min-height:9px;width:auto;color:var(--stamp);mix-blend-mode:screen;
  filter:drop-shadow(0 0 1px var(--stamp)) drop-shadow(0 0 5px rgb(255 107 18 / .65));opacity:.95}
.ui-stamp{height:1em;width:auto;color:var(--stamp-ink);vertical-align:-.1em;filter:drop-shadow(0 0 3px color-mix(in srgb,currentColor 45%,transparent))}

/* Inicio: pilas */
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 40px;margin-block:clamp(20px,5vw,56px) clamp(28px,5vw,64px)}
.home-title{margin:0;font-stretch:125%;font-weight:800;font-size:clamp(2.7rem,8vw,6.2rem);line-height:.86;letter-spacing:-.045em}
.home-sub{margin:0;max-width:34ch;color:var(--ink-soft);font-stretch:90%;font-size:1.02rem}
.stacks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(44px,7vw,96px) clamp(22px,4.5vw,72px);padding-bottom:clamp(64px,8vw,112px)}
.stack{display:block;position:relative;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;border-radius:6px}
.stacks .stack:nth-child(3n+2){margin-top:56px}
.stacks .stack:nth-child(3n){margin-top:18px}
.stack-box{position:relative;aspect-ratio:1/.86;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.stack .print{position:absolute;left:50%;top:50%;width:var(--w);transform:translate(-50%,-50%) translate(var(--tx,0%),var(--ty,0%)) rotate(var(--rot,0deg));transition:transform .55s var(--ease-out)}
.stack .cover{--rot:var(--r0)} .stack .u1{--rot:var(--r0);--tx:-3%} .stack .u2{--rot:var(--r0);--tx:3%;--ty:-2%}
@media (hover:hover){
  .stack:hover .u1,.stack:focus-visible .u1{--tx:-19%;--ty:2%;--rot:calc(var(--r0) - 8deg)}
  .stack:hover .u2,.stack:focus-visible .u2{--tx:19%;--ty:-5%;--rot:calc(var(--r0) + 8deg)}
  .stack:hover .cover,.stack:focus-visible .cover{--ty:-4%;--rot:calc(var(--r0) * .4);--lift:1}
}
@media (hover:none){ .stack .u1{--tx:-9%} .stack .u2{--tx:9%} }
.stack-label{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:10px}
.stack-title{margin:0;font-stretch:115%;font-weight:760;font-size:clamp(1.08rem,1.7vw,1.45rem);line-height:1.08;letter-spacing:-.02em}
.stack-meta{margin:.25rem 0 0;color:var(--ink-soft);font-stretch:74%;font-weight:500;font-size:.98rem;line-height:1.3}
.avatars{display:flex;flex:none;padding-top:2px}
.av{width:26px;height:26px;border-radius:50%;background:var(--avc,#4E6B78);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700;font-stretch:90%;box-shadow:0 0 0 2px var(--table);margin-left:-7px}
.av:first-child{margin-left:0}
.av.more{background:var(--chip);color:var(--ink)}
.credits{margin-block:0 48px;color:var(--ink-soft);font-stretch:84%;font-size:.9rem;max-width:72ch}
.credits summary{cursor:pointer;width:fit-content}
.credits p{margin:.5rem 0 0}
.credits a{color:inherit}

/* Álbum */
.crumbs{margin-top:6px}
.backlink{display:inline-flex;align-items:center;gap:.3rem;color:var(--ink-soft);text-decoration:none;font-stretch:90%;font-weight:600;padding:.35rem .5rem .35rem .15rem;border-radius:999px}
.backlink svg{width:18px;height:18px}
.album-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;margin-block:clamp(10px,2.5vw,24px) clamp(26px,4vw,48px)}
.album-title{grid-column:1/-1;margin:0;font-stretch:125%;font-weight:800;font-size:clamp(3rem,12vw,10rem);line-height:.84;letter-spacing:-.05em;text-wrap:balance;overflow-wrap:anywhere}
.album-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 26px;margin:0;color:var(--ink-soft);font-stretch:74%;font-weight:500;font-size:1.04rem;min-width:0}
.album-meta .who{display:inline-flex;align-items:center;gap:.55rem}
.album-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--chip)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:.48rem 1rem;border-radius:999px;font-weight:600;font-size:.92rem;font-stretch:96%;color:var(--ink-soft);cursor:pointer;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--btn-ink)}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;background:var(--btn);transition:transform .4s var(--ease-out),width .4s var(--ease-out)}
@media (max-width:760px){.album-head{grid-template-columns:minmax(0,1fr)}.album-actions{justify-content:flex-start}}

.spread{columns:3 250px;column-gap:clamp(18px,3.4vw,52px);padding-bottom:96px}
.cell{position:relative;break-inside:avoid;padding-block:clamp(10px,1.8vw,24px)}
.spread .print{width:var(--pw,100%);margin-left:var(--pm,0%);cursor:grab;touch-action:pan-y;-webkit-tap-highlight-color:transparent;will-change:auto}
.spread .print.lifted{cursor:grabbing;--lift:1}
@media (max-width:560px){.spread{columns:2;column-gap:12px}.cell{padding-block:8px}}

/* Carrusel de diapositivas */
.carousel{position:relative;height:clamp(340px,44vw,540px);margin-left:calc(-1 * var(--side-l));margin-right:calc(-1 * var(--side-r));perspective:1600px;perspective-origin:50% 30%;overflow:hidden;touch-action:pan-y;cursor:grab;outline:none;user-select:none}
.carousel:focus-visible{outline:2px solid var(--stamp);outline-offset:-6px;border-radius:12px}
.carousel.dragging{cursor:grabbing}
.floor{position:absolute;left:50%;top:82%;width:min(900px,120vw);height:120px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--shadow),transparent);opacity:.55;pointer-events:none}
.ring{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d}
.slide{position:absolute;left:calc(var(--S) / -2);top:calc(var(--S) / -2);width:var(--S);height:var(--S);border:0;padding:0;background:none;cursor:pointer;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mount{position:absolute;inset:0;border-radius:7%;background:var(--mount);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .07),inset 0 2px 0 rgb(255 255 255 / .6),0 22px 40px -16px var(--shadow)}
.mount .win{position:absolute;left:50%;top:45%;width:var(--ww);aspect-ratio:var(--ar);transform:translate(-50%,-50%);overflow:hidden;border-radius:2px;background:color-mix(in srgb,var(--c,#888) 50%,#000);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .3)}
.mount .win img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.mount .lbl{position:absolute;left:8%;right:8%;bottom:3.5%;text-align:center;font-family:var(--font-hand);font-size:calc(var(--S) * .088);line-height:1;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mount .num{position:absolute;top:4.5%;right:8%;font-stretch:70%;font-weight:600;font-size:calc(var(--S) * .048);color:rgb(38 46 51 / .5)}
.slide::after{content:"";position:absolute;inset:0;border-radius:7%;background:var(--table);opacity:calc((1 - var(--f,1)) * .8);pointer-events:none}
.c-foot{display:flex;align-items:center;justify-content:center;gap:16px;padding-block:6px 80px}
.c-cap{margin:0;min-width:0;flex:0 1 46ch;text-align:center;font-family:var(--font-hand);font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.05;color:var(--ink)}
.c-count{display:block;font-family:var(--font-ui);font-stretch:74%;font-size:.92rem;color:var(--ink-soft);margin-top:.35rem}

/* Visor */
.viewer{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.v-scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.v-top,.v-bottom{position:relative;display:flex;align-items:center;gap:12px;padding-left:var(--side-l);padding-right:var(--side-r)}
.v-top{justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:6px}
.v-title{margin:0;min-width:0;font-stretch:80%;font-weight:600;font-size:1rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-title span{color:var(--ink-soft);font-weight:500}
.v-bottom{justify-content:center;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.v-stage{position:relative;display:grid;place-items:center;min-height:0;touch-action:none}
.vpos{position:relative}
.vtilt{position:absolute;inset:0;perspective:1800px;transform:perspective(1400px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.vcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .72s var(--ease-flip)}
.vcard.flipped{transform:rotateY(180deg)}
.vcard.instant{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face .paper{position:absolute;inset:0;transform:none;box-shadow:0 0 0 .5px rgb(0 0 0 / .08),inset 0 1px 0 var(--rim),0 2px 3px rgb(0 0 0 / .18),0 40px 80px -24px var(--shadow)}
.face.back{transform:rotateY(180deg)}
.back-paper{position:absolute;inset:0;overflow:hidden;border-radius:2px;background:var(--paper-back);color:var(--paper-ink);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5%;padding:6.5% 7%;
  box-shadow:0 0 0 .5px rgb(0 0 0 / .08),0 2px 3px rgb(0 0 0 / .18),0 40px 80px -24px var(--shadow)}
.back-paper.wide{grid-template-rows:none;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:6%}
.wm{position:absolute;inset:-60%;transform:rotate(-24deg);opacity:.08;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='330' height='44'><text x='0' y='26' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='700' letter-spacing='3' fill='%23262E33'>MEMORIES  PAPEL DE ARCHIVO</text></svg>")}
.note{position:relative;display:flex;flex-direction:column;min-height:0}
.note label{font-stretch:74%;font-weight:600;font-size:var(--fs-s);color:rgb(38 46 51 / .55)}
.note textarea{flex:1;min-height:3em;width:100%;resize:none;border:0;background:none;padding:0;margin-top:.2em;color:var(--pen);font-family:var(--font-hand);font-size:var(--fs-h);line-height:1.02;outline:none}
.note textarea::placeholder{color:rgb(34 53 127 / .4)}
.note textarea:focus-visible{outline:1.5px dashed rgb(34 53 127 / .35);outline-offset:6px}
.specs{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2em 1.1em;margin:0;align-content:end;font-stretch:72%;font-size:var(--fs-s);line-height:1.3}
.specs dt{color:rgb(38 46 51 / .58);font-weight:500}
.specs dd{margin:0;font-weight:640;overflow-wrap:anywhere}
.specs .ui-stamp{color:var(--paper-stamp);filter:none;height:1.3em;vertical-align:-.3em}
.v-flip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

/* Compartir */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center}
.sheet-scrim{position:absolute;inset:0;background:rgb(8 12 14 / .4)}
.sheet-card{position:relative;width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:22px 22px 20px;box-shadow:0 30px 80px -20px rgb(0 0 0 / .5)}
.sheet-card h2{margin:0 0 4px;font-stretch:118%;font-weight:780;font-size:1.4rem;letter-spacing:-.02em;line-height:1.1}
.sheet-card .sub{margin:0 0 18px;color:rgb(38 46 51 / .66);font-stretch:88%;font-size:.95rem}
.sheet-card h3{margin:18px 0 8px;font-stretch:88%;font-weight:700;font-size:.92rem}
.members{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.members li{display:flex;align-items:center;gap:10px;font-size:.96rem}
.members .av{box-shadow:none;margin:0;width:30px;height:30px}
.members .role{margin-left:auto;color:rgb(38 46 51 / .6);font-stretch:80%;font-size:.88rem}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0;border:1px solid rgb(38 46 51 / .18);border-radius:999px;background:rgb(255 255 255 / .6);padding:.55rem .9rem;font:inherit;font-size:.9rem;font-stretch:84%;color:var(--paper-ink)}
.sheet-card .btn{background:var(--paper-btn);color:var(--paper-btn-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:.95rem;cursor:pointer}

function sizeCarousel() {

  const S = clamp(Math.min(innerWidth * .5, innerHeight * .4), 170, 350);
  C.car.style.setProperty('--S', `${S}px`);
  C.R = C.n < 3 ? S * .9 : (S / 2) / Math.tan(Math.PI / C.n) * 1.1;
  C.slides.forEach((s, i) => { s.style.transform = `rotateY(${i * C.step}deg) translateZ(${C.R}px)`; });
  cRender();
}
function cRender() {
  if (!C) return;
  C.ring.style.transform = `translateZ(${-C.R}px) rotateX(-4deg) rotateY(${C.theta}deg)`;
  C.slides.forEach((s, i) => s.style.setProperty('--f', ((1 + Math.cos((C.theta + i * C.step) * Math.PI / 180)) / 2).toFixed(3)));
  const front = ((Math.round(-C.theta / C.step) % C.n) + C.n) % C.n;
  if (front !== C.front) {
    C.front = front;
    const p = state.album.photos[front];
    $('#cCap').innerHTML = `${esc(p.caption || 'Sin nota todavía')}<span class="c-count">${front + 1} de ${C.n}, ${esc(p.spot || '')}</span>`;
  }
}
function cKick() {
  if (!C) return;
  if (RM.matches) { C.theta = C.target; cRender(); return; }
  if (C.raf) return;
  const tick = () => {
    const d = C.target - C.theta;
    C.theta += d * .13;
    if (Math.abs(d) < .03) { C.theta = C.target; cRender(); C.raf = 0; return; }
    cRender(); C.raf = requestAnimationFrame(tick);
  };
  C.raf = requestAnimationFrame(tick);
}
function goSlide(i) {
  const want = -i * C.step;
  let d = ((want - C.target) % 360 + 540) % 360 - 180;
  C.target += d; cKick();
}
function stopCarousel() { if (C && C.raf) cancelAnimationFrame(C.raf); C = null; }

/* ---------- Visor: levantar, dar vuelta, navegar ---------- */
const V = { open: false, album: null, i: 0, src: null, busy: false, back: null };
const viewer = $('#viewer'), vPos = $('#vPos'), vTilt = $('#vTilt'), vCard = $('#vCard'), vImg = $('#vImg'), vPhoto = $('#vPhoto'), vBack = $('#vBack');

function srcRotation(el) {
  const st = PS.get(el); if (st) return st.r;
  return parseFloat(getComputedStyle(el).getPropertyValue('--rot')) || 0;
}
function layoutViewer() {
  const p = V.album.photos[V.i];
  const stage = $('#vStage').getBoundingClientRect();
  const k = cardRatio(p.ar);
  let w = Math.min(stage.width - 32, 1180), h = w / k;
  const maxH = Math.max(160, stage.height - 20);
  if (h > maxH) { h = maxH; w = h * k; }
  vPos.style.width = `${w}px`; vPos.style.height = `${h}px`;
  vPos.style.setProperty('--fs-h', `${clamp(w * .062, 20, 46)}px`);
  vPos.style.setProperty('--fs-s', `${clamp(w * .027, 12, 16)}px`);
  const bp = $('.back-paper', vBack); if (bp) bp.classList.toggle('wide', k > 1.15);
}
function fillViewer() {
  const a = V.album, p = a.photos[V.i];
  $('#vTitle').innerHTML = `${esc(a.title)} <span>${V.i + 1} de ${a.photos.length}</span>`;
  vPhoto.style.setProperty('--ar', p.ar); vPhoto.style.setProperty('--c', p.c);
  vImg.src = p.src;
  vImg.alt = p.caption || `Foto de ${a.title}`;
  $('.stamp', vPhoto)?.remove();
  vPhoto.insertAdjacentHTML('beforeend', stampSVG(p.date));
  if (p.big && p.big !== p.src) {
    const want = p.big, im = new Image();
    im.src = want;
    im.decode().then(() => { if (a.photos[V.i] === p) vImg.src = want; }).catch(() => {});
  }
  const by = PEOPLE[p.by] ? PEOPLE[p.by].name : 'Vos';
  vBack.innerHTML = `<div class="back-paper"><div class="wm"></div>
    <div class="note"><label for="noteField">Escrito atrás</label><textarea id="noteField" rows="3" placeholder="Escribí algo atrás de la foto" spellcheck="false">${esc(p.caption || '')}</textarea></div>
    <dl class="specs">
      <dt>Lugar</dt><dd>${esc(p.spot || a.place)}</dd>
      <dt>Fecha</dt><dd>${stampSVG(p.date, 'ui-stamp')}&nbsp;&nbsp;${fmtTime(p.date)}</dd>
      <dt>Cámara</dt><dd>${esc(p.cam)}</dd>
      ${p.exp ? `<dt>Exposición</dt><dd>${esc(p.exp)}</dd>` : ''}
      <dt>Subida por</dt><dd>${esc(by)}</dd>
      <dt>Archivo</dt><dd>${esc(p.file)}</dd>
    </dl></div>`;
  $('#noteField').addEventListener('input', e => { p.caption = e.target.value; });
  layoutViewer();
}
function setFlipped(on, instant) {
  if (instant) vCard.classList.add('instant');
  vCard.classList.toggle('flipped', on);
  $('#vFlip').setAttribute('aria-pressed', String(on));
  $('#vFlipText').textContent = on ? 'Ver foto' : 'Dar vuelta';
  if (instant) { vCard.offsetWidth; vCard.classList.remove('instant'); }
}
function sourceFor(i) {
  if (state.mode === 'carrusel' && C) return $('.win', C.slides[i]);
  return $(`.spread .print[data-i="${i}"]`, view);
}
function openViewer(album, i, srcEl) {
  if (V.open || !album.photos[i]) return;
  V.open = true; V.album = album; V.i = i; V.back = document.activeElement;
  viewer.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  setFlipped(false, true);
  fillViewer();
  setSource(srcEl);
  if (!RM.matches) {
    if (srcEl) {
      const s = srcEl.getBoundingClientRect(), t = vPos.getBoundingClientRect();
      vPos.animate([
        { transform: `translate(${s.left + s.width / 2 - (t.left + t.width / 2)}px,${s.top + s.height / 2 - (t.top + t.height / 2)}px) rotate(${srcRotation(srcEl)}deg) scale(${srcEl.offsetWidth / t.width})` },
        { transform: 'none' },
      ], { duration: 620, easing: EASE });
    }
    $('#vScrim').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: 'ease-out' });
    [$('#vTop'), $('#vBottom')].forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 220, fill: 'backwards' }));
  }
  $('#vClose').focus({ preventScroll: true });
}
function setSource(el) {
  if (V.src && V.src !== el) V.src.style.visibility = '';
  V.src = el || null;
  if (V.src) V.src.style.visibility = 'hidden';
}
async function closeViewer(skipAnim) {
  if (!V.open) return;
  V.open = false;
  const src = V.src && V.src.isConnected ? V.src : null;
  if (!skipAnim && !RM.matches) {
    const anims = [$('#vScrim'), $('#vTop'), $('#vBottom')].map(el => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }));
    let a;
    const s = src && src.getBoundingClientRect();
    if (s && s.bottom > 0 && s.top < innerHeight) {
      const t = vPos.getBoundingClientRect();
      a = vPos.animate([
        { transform: 'none' },
        { transform: `translate(${s.left + s.width / 2 - (t.left + t.width / 2)}px,${s.top + s.height / 2 - (t.top + t.height / 2)}px) rotate(${srcRotation(src)}deg) scale(${src.offsetWidth / t.width})` },
      ], { duration: 460, easing: EASE, fill: 'forwards' });
    } else {
      a = vPos.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.94)' }], { duration: 260, fill: 'forwards' });
    }
    await a.finished.catch(() => {});
    anims.forEach(x => x.cancel()); a.cancel();
  }
  viewer.hidden = true;
  document.documentElement.style.overflow = '';
  setSource(null);
  tiltRelease(vTilt);
  if (V.back && V.back.isConnected) V.back.focus({ preventScroll: true });
}
async function nav(dir, fromX = 0) {
  if (V.busy || !V.open) return;
  const n = V.album.photos.length; if (n < 2) return;
  V.busy = true;
  const next = (V.i + dir + n) % n;
  if (!RM.matches) {
    const out = vPos.animate([
      { transform: `translateX(${fromX}px) rotate(${fromX * .015}deg)`, opacity: 1 },
      { transform: `translateX(${-dir * 55}vw) rotate(${-dir * 8}deg)`, opacity: 0 },
    ], { duration: 240, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
    await out.finished.catch(() => {});
    V.i = next; setFlipped(false, true); fillViewer(); setSource(sourceFor(next));
    if (state.mode === 'carrusel' && C) goSlide(next);
    out.cancel();
    await vPos.animate([
      { transform: `translateX(${dir * 40}vw) rotate(${dir * 7}deg)`, opacity: 0 },
      { transform: 'none', opacity: 1 },
    ], { duration: 460, easing: EASE }).finished.catch(() => {});
  } else {
    V.i = next; setFlipped(false, true); fillViewer(); setSource(sourceFor(next));
    if (state.mode === 'carrusel' && C) goSlide(next);
  }
  V.busy = false;
}
$('#vClose').addEventListener('click', () => closeViewer());
$('#vScrim').addEventListener('click', () => closeViewer());
$('#vPrev').addEventListener('click', () => nav(-1));
$('#vNext').addEventListener('click', () => nav(1));
$('#vFlip').addEventListener('click', () => setFlipped(!vCard.classList.contains('flipped')));
(() => {
  const stage = $('#vStage');
  let sw = null;
  stage.addEventListener('pointermove', e => {
    if (sw) return;
    if (e.pointerType === 'mouse' && !RM.matches && V.open) tiltTo(stage, vTilt, e, 6);
  });
  stage.addEventListener('pointerleave', () => tiltRelease(vTilt));
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('textarea') || e.button > 0) return;
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, dx: 0, onCard: !!e.target.closest('.vpos') };
  });
  addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id || V.busy) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { sw.moved = true; tiltRelease(vTilt); }
    if (sw.moved) { sw.dx = dx; vPos.style.transform = `translateX(${dx}px) rotate(${dx * .015}deg)`; }
  });
  const end = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const s = sw; sw = null;
    if (s.moved) {
      if (Math.abs(s.dx) > 70) { vPos.style.transform = ''; nav(s.dx < 0 ? 1 : -1, s.dx); }
      else {
        const from = vPos.style.transform; vPos.style.transform = '';
        if (!RM.matches) vPos.animate([{ transform: from }, { transform: 'none' }], { duration: 380, easing: EASE });
      }
    } else if (!s.onCard && e.type === 'pointerup' && e.target === stage) closeViewer();
  };
  addEventListener('pointerup', end);
  addEventListener('pointercancel', end);
})();

/* ---------- Compartir ---------- */
const sheet = $('#sheet');
function openShare() {
  const a = state.album; if (!a) return;
  const token = hash(a.slug).toString(36).slice(0, 6);
  const others = a.people.filter(i => i !== 'vos');
  $('#sheetCard').innerHTML = `
    <button class="icon-btn sheet-close" type="button" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="sheetTitle">Compartir ${esc(a.title)}</h2>
    <p class="sub">Las personas del álbum pueden ver y subir fotos. El link sirve para que otros solo miren.</p>
    <h3>Personas en este álbum</h3>
    <ul class="members">
      <li><span class="av" style="--avc:${PEOPLE.vos.c}">V</span>Vos<span class="role">Administrás el álbum</span></li>
      ${others.map(i => `<li><span class="av" style="--avc:${PEOPLE[i].c}">${PEOPLE[i].ini}</span>${PEOPLE[i].name}<span class="role">Puede subir fotos</span></li>`).join('')}
    </ul>
    <h3>Link para ver</h3>
    <div class="linkrow"><input id="shareLink" type="text" readonly value="https://fotos.ejemplo.com/s/${token}" aria-label="Link del álbum"><button class="btn" type="button" id="copyLink">Copiar link</button></div>
    <label class="toggle" for="tgPublic">Cualquiera con el link puede ver<input type="checkbox" id="tgPublic" checked></label>
    <label class="toggle" for="tgPass">Pedir contraseña<input type="checkbox" id="tgPass"></label>
    <label class="toggle" for="tgDl">Permitir descargar originales<input type="checkbox" id="tgDl" checked></label>`;
  sheet.hidden = false;
  if (!RM.matches) {
    const narrow = innerWidth <= 560;
    $('#sheetCard').animate(narrow ? [{ transform: 'translateY(100%)' }, { transform: 'none' }] : [{ transform: 'translateY(16px) scale(.97)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: EASE });
    $('.sheet-scrim', sheet).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
  }
  $('#copyLink').addEventListener('click', async () => {
    const input = $('#shareLink');
    try { await navigator.clipboard.writeText(input.value); toast('Link copiado'); }
    catch (_) { input.focus(); input.select(); toast('Seleccioné el link: copialo con Ctrl+C'); }
  });
  $('#copyLink').focus({ preventScroll: true });
}
function closeShare() { sheet.hidden = true; $('#shareBtn')?.focus({ preventScroll: true }); }
sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeShare(); });

/* ---------- Subir fotos: revelado ---------- */
const fileInput = $('#file');
$('#uploadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
function readDims(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = rej; im.src = url; });
}
async function addFiles(list) {
  const files = [...list];
  if (!files.length) return;
  let a = state.album;
  if (!a) {
    a = albums.find(x => x.slug === 'reveladas');
    if (!a) { a = { slug: 'reveladas', title: 'Recién reveladas', place: 'Sin lugar todavía', coords: '', people: ['vos'], photos: [] }; albums.unshift(a); }
  }
  const added = [];
  for (const f of files) {
    if (f.type && !f.type.startsWith('image/')) { toast(`${f.name} no es una foto. Probá con JPG, PNG o WebP.`); continue; }
    const url = URL.createObjectURL(f);
    let dims;
    try { dims = await readDims(url); } catch (_) { URL.revokeObjectURL(url); toast(`No pudimos leer ${f.name}. Probá exportarla como JPG.`); continue; }
    const ar = dims[0] / dims[1];
    const p = { id: `u${++uploadSeq}`, o: ar > 1.15 ? 'L' : ar < .87 ? 'P' : 'S', ar, c: '#8a8a8a', src: url, big: url, uploaded: true,
      date: new Date(f.lastModified || Date.now()), caption: '', spot: a.place, cam: 'Sin datos de cámara', exp: '', by: 'vos', file: f.name };
    a.photos.unshift(p); added.push(p);
  }
  if (!added.length) return;
  toast(added.length === 1 ? '1 foto revelada' : `${added.length} fotos reveladas`);
  if (state.album) renderBody(); else renderHome();
  const fresh = new Set(added.map(p => p.src));
  $$('img', view).forEach(img => { if (fresh.has(img.getAttribute('src'))) develop(img, 2600); });
}
const drop = $('#drop');
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; drop.hidden = false; });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; drop.hidden = true; addFiles(e.dataTransfer.files); });

/* ---------- Avisos ---------- */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------- Luz de la mesa ---------- */
const root = document.documentElement, sw = $('#lightswitch'), mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
const syncSwitch = () => sw.setAttribute('aria-checked', String(!isDark()));
try { const saved = localStorage.getItem('memories-theme'); if (saved === 'dark' || saved === 'light') root.dataset.theme = saved; } catch (_) {}
syncSwitch();
mq.addEventListener('change', syncSwitch);
new MutationObserver(syncSwitch).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
sw.addEventListener('click', () => {
  const toDark = !isDark();
  root.dataset.theme = toDark ? 'dark' : 'light';
  try { localStorage.setItem('memories-theme', root.dataset.theme); } catch (_) {}
  if (RM.matches) return;
  const fx = $('#fx');
  fx.animate(toDark
    ? [{ opacity: 1 }, { opacity: .85, offset: .35 }, { opacity: 0 }]
    : [{ opacity: 1 }, { opacity: 0, offset: .1 }, { opacity: .7, offset: .17 }, { opacity: 0, offset: .28 }, { opacity: .35, offset: .36 }, { opacity: 0, offset: .5 }, { opacity: 0 }],
    { duration: toDark ? 1100 : 760, easing: 'linear' });
});

/* ---------- Teclado y foco ---------- */
addEventListener('keydown', e => {
  if (!sheet.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeShare(); }
    else if (e.key === 'Tab') trapFocus(e, $('#sheetCard'));
    return;
  }
  if (!V.open) return;
  const typing = e.target.closest && e.target.closest('textarea');
  if (e.key === 'Escape') { e.preventDefault(); if (typing) e.target.blur(); else closeViewer(); }
  else if (e.key === 'Tab') trapFocus(e, viewer);
  else if (typing) return;
  else if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setFlipped(!vCard.classList.contains('flipped')); }
});
function trapFocus(e, box) {
  const f = $$('button:not([hidden]),[href],input,textarea,[tabindex]:not([tabindex="-1"])', box).filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------- Rutas ---------- */
function route() {
  if (V.open) closeViewer(true);
  if (!sheet.hidden) sheet.hidden = true;
  const slug = decodeURIComponent(location.hash.slice(1));
  const a = albums.find(x => x.slug === slug);
  if (a) { if (state.album !== a) state.mode = 'mesa'; renderAlbum(a); }
  else { state.flip = null; renderHome(); }
}
addEventListener('hashchange', route);
let rz = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => { if (V.open) layoutViewer(); sizeCarousel(); placeSegThumb(true); });
});
route();
document.fonts?.ready.then(() => placeSegThumb(true));
})();
</script>
